[package]
name = "trust-browser"
version = "0.1.0"
edition = "2024"
description = "Device browser and Starter interface for TRust (egui), with forms inferred from the device interface"
license = "GPL-3.0-or-later"

[[bin]]
name = "trust-browser"
path = "src/main.rs"

# Demo devices to try the browser on; started by the tests through a Starter
[[bin]]
name = "DemoServer"
path = "src/bin/demo_server.rs"

[dependencies]
serde_json = "1"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
egui_plot = "0.38"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
trust = { path = "../..", features = ["full"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
eframe = { version = "0.37", default-features = false, features = ["wayland", "x11"] }

# in a web page: WebSocket only, the browser's event loop, the page's URL and canvas
[target.'cfg(target_arch = "wasm32")'.dependencies]
trust = { path = "../..", default-features = false, features = ["ws"] }
tokio = { version = "1", features = ["sync"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "UrlSearchParams", "HtmlCanvasElement", "console"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
egui_kittest = "0.37"
trust-databaseds = { path = "../databaseds" }
trust-starter = { path = "../starter" }
